name: Feature / vertical slice
description: A small implementation slice tied to requirements.
title: '[slice] '
labels: ['type:feature']
body:
  - type: input
    id: requirements
    attributes:
      label: Requirement IDs
      placeholder: FR-PRJ-001, NFR-SEC-002
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Write observable pass/fail statements.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      placeholder: 'Depends on #123'
  - type: textarea
    id: dod
    attributes:
      label: Definition of Done
      value: |
        - [ ] code and tests
        - [ ] authorization/RLS
        - [ ] telemetry and safe errors
        - [ ] docs/traceability
