name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg18
        env:
          POSTGRES_DB: docoo_ci
          POSTGRES_USER: docoo_admin
          POSTGRES_PASSWORD: docoo-ci-admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docoo_admin -d docoo_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.6.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm docs:validate
      - run: pnpm qa:corpus
      - run: pnpm docs:test
      - run: pnpm docs:sync:plan
      - run: pnpm db:migrate
        env:
          DATABASE_ADMIN_URL: postgresql://docoo_admin:docoo-ci-admin@localhost:5432/docoo_ci
      - run: pnpm db:test:rls
        env:
          DATABASE_TEST_ADMIN_URL: postgresql://docoo_admin:docoo-ci-admin@localhost:5432/docoo_ci
      - run: pnpm --filter @docoo/api test:integration
        env:
          DATABASE_TEST_ADMIN_URL: postgresql://docoo_admin:docoo-ci-admin@localhost:5432/docoo_ci
      - name: Prepare end-to-end data
        env:
          DATABASE_ADMIN_URL: postgresql://docoo_admin:docoo-ci-admin@localhost:5432/docoo_ci
        run: |
          # A non-superuser runtime role so the API runs under RLS exactly as in production.
          psql "$DATABASE_ADMIN_URL" -v ON_ERROR_STOP=1 -c \
            "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'docoo_e2e') THEN CREATE ROLE docoo_e2e LOGIN PASSWORD 'docoo-e2e-runtime' IN ROLE docoo_app; END IF; END \$\$;"
          node apps/web/e2e/prepare.mjs
      - run: pnpm --filter @docoo/web exec playwright install --with-deps chromium
      - run: pnpm --filter @docoo/web test:e2e
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://docoo_e2e:docoo-e2e-runtime@localhost:5432/docoo_ci
          SESSION_PEPPER: docoo-ci-e2e-pepper-with-at-least-32-characters
          WEB_ORIGIN: http://localhost:3000
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/coverage/
            **/test-results/
            **/playwright-report/
          if-no-files-found: ignore
