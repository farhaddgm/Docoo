name: Deploy smoke

# Runs the real installer (scripts/deploy/install.sh) on a clean machine with the production
# stack: images, migrations, HTTPS through Caddy, the administrator's set-password link and a
# signed-in request. Proves a non-expert owner can install a release with one command.
# The edge variant installs on a server whose ports 80/443 already belong to another Caddy
# (a site that must keep working): Docoo has to run behind it.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '7 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mode: [direct, edge]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Free disk space on the runner
        # Six images, the object store and the databases fill the stock runner; SeaweedFS then
        # refuses new volumes below 1% free and the off-host backup step fails for that reason.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: An existing Caddy already serves another site on ports 80/443
        if: matrix.mode == 'edge'
        run: |
          mkdir -p "$RUNNER_TEMP/edge"
          printf 'other.localhost {\n\trespond "other site"\n}\n' > "$RUNNER_TEMP/edge/Caddyfile"
          docker run -d --name existing-proxy -p 80:80 -p 443:443 \
            -v "$RUNNER_TEMP/edge/Caddyfile:/etc/caddy/Caddyfile" caddy:2@sha256:f2a1290d0463aad60660d4ec134943f183ee2a5f6c3eb7bf32dd984f2f020772
      - name: Install the production stack (unattended)
        env:
          DOCOO_UNATTENDED: '1'
          DOCOO_SKIP_FIREWALL: '1'
          DOMAIN: localhost
          FILES_DOMAIN: files.localhost
          ACME_EMAIL: ops@example.test
          ADMIN_EMAIL: owner@example.test
          ADMIN_DISPLAY_NAME: Owner
          # Backups go to a bucket in the stack's own object store here; in production this is
          # an off-host S3 bucket.
          S3_SECRET_ACCESS_KEY: deploy-smoke-object-secret
          BACKUP_S3_PREFIX: s3://docoo-backups/smoke
          BACKUP_S3_ENDPOINT: http://object-store:8333
          BACKUP_S3_ACCESS_KEY_ID: docoo
          BACKUP_S3_SECRET_ACCESS_KEY: deploy-smoke-object-secret
          BACKUP_S3_FORCE_PATH_STYLE: 'true'
        run: sudo -E ./scripts/deploy/install.sh 2>&1 | tee install.log
      - name: Set the password with the printed link and sign in over HTTPS
        run: |
          set -euo pipefail
          link=$(grep -o 'https://localhost/fa/reset-password#token=[^ ]*' install.log | head -1)
          test -n "$link" || { echo 'No set-password link was printed'; exit 1; }
          token=${link#*token=}
          h=(-H 'content-type: application/json' -H 'origin: https://localhost' -H 'sec-fetch-site: same-origin')
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/fa)" = 200
          curl -skI https://localhost/fa | grep -i '^strict-transport-security'
          test "$(curl -sk -o /dev/null -w '%{http_code}' -X POST https://localhost/api/auth/password/reset "${h[@]}" \
            -d "{\"token\":\"$token\",\"newPassword\":\"owner-chosen-password-1\"}")" = 204
          curl -sk -D headers.txt -o login.json -X POST https://localhost/api/auth/login "${h[@]}" \
            -d '{"identifier":"owner@example.test","password":"owner-chosen-password-1"}'
          grep -i '^set-cookie' headers.txt | grep -i 'secure' | grep -i 'httponly'
          cookie=$(grep -i '^set-cookie' headers.txt | sed -E 's/^[Ss]et-[Cc]ookie: ([^;]+).*/\1/')
          workspace=$(python3 -c "import json;print(json.load(open('login.json'))['workspaces'][0]['id'])")
          test "$(curl -sk -o /dev/null -w '%{http_code}' -H "cookie: $cookie" https://localhost/api/workspaces/$workspace/dashboard)" = 200
          echo 'Installed, HTTPS, set-password link and signed-in dashboard: OK'
      - name: The existing site keeps working and Docoo runs behind its proxy
        if: matrix.mode == 'edge'
        run: |
          set -euo pipefail
          sudo grep -x 'EDGE_PROXY=existing-proxy' deploy/.env
          sudo grep -x 'TRUST_PROXY_HOPS=2' deploy/.env
          grep -q '^# docoo:begin' "$RUNNER_TEMP/edge/Caddyfile"
          test -f "$RUNNER_TEMP/edge/Caddyfile.before-docoo"
          test "$(curl -sk https://other.localhost/ --resolve other.localhost:443:127.0.0.1)" = 'other site'
          # Docoo's own Caddy publishes no ports in this mode.
          test -z "$(sudo docker port docoo-caddy-1)"
          # A second run (an update) changes nothing in the existing Caddyfile.
          sudo git config --global --add safe.directory "$PWD"
          sudo DOCOO_UPDATE_REF="$(git rev-parse HEAD)" ./scripts/deploy/install.sh update > update.log 2>&1 || { tail -40 update.log; exit 1; }
          test "$(grep -c '^# docoo:begin' "$RUNNER_TEMP/edge/Caddyfile")" = 1
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/fa)" = 200
      - name: Nightly update is installed, can be switched off and on, and a night with nothing new changes nothing
        run: |
          set -euo pipefail
          # The runner's checkout belongs to the runner user, git refuses it for root; on a server
          # /opt/docoo is root's own, so only the test needs this.
          sudo git config --global --add safe.directory "$PWD"
          test "$(systemctl is-enabled docoo-update.timer)" = enabled
          systemctl is-active docoo-update.timer
          systemctl cat docoo-update.service | grep -F "ExecStart=$PWD/scripts/deploy/install.sh update --scheduled"
          sudo systemd-analyze verify /etc/systemd/system/docoo-update.service /etc/systemd/system/docoo-update.timer
          sudo ./scripts/deploy/install.sh auto-update off
          test "$(systemctl is-enabled docoo-update.timer || true)" = disabled
          sudo grep -x 'AUTO_UPDATE=off' deploy/.env
          sudo ./scripts/deploy/install.sh update --scheduled 2>&1 | tee nightly-off.log
          grep -q 'Automatic updates are off' nightly-off.log
          sudo ./scripts/deploy/install.sh auto-update on
          test "$(systemctl is-enabled docoo-update.timer)" = enabled
          # Nothing newer than what runs: the nightly run must not rebuild or restart anything.
          current=$(sudo sed -n 's/^DOCOO_VERSION=//p' deploy/.env)
          sudo DOCOO_UPDATE_REF="$current" ./scripts/deploy/install.sh update --scheduled 2>&1 | tee nightly-same.log
          grep -q 'nothing to do' nightly-same.log
          ! grep -q 'Building and starting' nightly-same.log
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/fa)" = 200
      - name: Runtime checks (PDF renderer, OCR, object store, scanner)
        run: |
          set -euo pipefail
          c=(sudo docker compose --project-directory deploy -f deploy/compose.production.yaml)
          "${c[@]}" exec -T document-renderer /usr/bin/chromium --version
          "${c[@]}" exec -T document-renderer node --input-type=module -e '
            import {verifyChromiumSandbox} from "@docoo/documents";
            await verifyChromiumSandbox();
            console.log("Chromium PID/network namespaces and seccomp-BPF sandbox verified");'
          "${c[@]}" exec -T api node --input-type=module -e '
            const response=await fetch(new URL("/render",process.env.PDF_RENDERER_URL),{method:"POST",body:"{}"});
            if(response.status!==401) process.exit(1);
            console.log("Unauthenticated renderer access refused");'
          "${c[@]}" exec -T api node --input-type=module -e '
            import {renderPdf} from "@docoo/documents";
            const pdf=await renderPdf("<h1>Isolated PDF</h1>",{documentId:"00000000-0000-4000-8000-000000000000",version:1,createdAt:"2026-10-07"});
            if (Buffer.from(pdf).subarray(0,5).toString()!=="%PDF-") process.exit(1);
            console.log("Authenticated isolated PDF rendering passed: "+pdf.length+" bytes");'
          "${c[@]}" exec -T web node -e 'for(const k of ["DATABASE_URL","SESSION_PEPPER","SECRET_MASTER_KEY","GOOGLE_CLIENT_SECRET","S3_SECRET_ACCESS_KEY"]) if(process.env[k]) process.exit(1)'
          "${c[@]}" exec -T worker-ingestion node -e 'for(const k of ["SESSION_PEPPER","SECRET_MASTER_KEY","GOOGLE_CLIENT_SECRET"]) if(process.env[k]) process.exit(1)'
          "${c[@]}" exec -T worker-ingestion tesseract --list-langs | grep -x fas
          curl -sk -o /dev/null -w 'files host %{http_code}\n' https://files.localhost/
          # The browser uploads answer files straight to this host from the app's own origin.
          curl -sk -i -X OPTIONS https://files.localhost/docoo/preflight-probe \
            -H 'Origin: https://localhost' -H 'Access-Control-Request-Method: PUT' \
            -H 'Access-Control-Request-Headers: content-type' |
            grep -i '^access-control-allow-origin: https://localhost'
          # The page's Content-Security-Policy is built at run time and must allow that host.
          curl -skI https://localhost/fa |
            grep -i "^content-security-policy:.*connect-src 'self' https://files.localhost;"
          "${c[@]}" ps
      - name: Off-host backup (WAL-G base backup + WAL archive, object mirror)
        run: |
          set -euo pipefail
          c=(sudo docker compose --project-directory deploy -f deploy/compose.production.yaml)
          sudo docker run --rm --network docoo_backend \
            -e RCLONE_CONFIG_S_TYPE=s3 -e RCLONE_CONFIG_S_PROVIDER=Other -e RCLONE_CONFIG_S_ENDPOINT=http://object-store:8333 \
            -e RCLONE_CONFIG_S_ACCESS_KEY_ID=docoo -e RCLONE_CONFIG_S_SECRET_ACCESS_KEY=deploy-smoke-object-secret \
            rclone/rclone:latest@sha256:45401ad7410db1d67ffdb58e19059ad20b0d8e0285a60e38bbec55cc1019c7a5 mkdir s:docoo-backups
          "${c[@]}" restart backup object-backup
          for i in $(seq 1 60); do
            "${c[@]}" logs backup | grep -q backup.completed && break
            sleep 5
          done
          "${c[@]}" logs backup | tail -5
          "${c[@]}" exec -T backup wal-g backup-list
          "${c[@]}" exec -T api node -e '
            const fs=require("node:fs");
            const last=Number(fs.readFileSync("/run/docoo-backup/database-success","utf8"));
            if(!Number.isFinite(last)||Date.now()/1000-last>600) process.exit(1);
            console.log("Database backup heartbeat is readable by the restricted API");'

          "${c[@]}" exec -T postgres psql -U docoo_admin -d docoo -tAc "select pg_switch_wal()" >/dev/null
          sleep 10
          "${c[@]}" exec -T postgres psql -U docoo_admin -d docoo -tAc \
            "select archived_count > 0 and failed_count = 0 from pg_stat_archiver" | grep -x t
      - name: Acceptance evidence report (the script the owner runs for the private-beta sign-off)
        env:
          DOCOO_ACCEPTANCE_CURL_OPTS: -k
        run: |
          set -uo pipefail
          # Exit 1 means a FAIL row; the rows below are what a clean install must always show.
          # The AI connection, mail and release rows depend on the owner and on tags, not on the install.
          sudo -E ./scripts/deploy/acceptance.sh | tee acceptance.md
          grep -F '| Containers | PASS |' acceptance.md
          grep -F '| API ready | PASS |' acceptance.md
          # Caddy's local CA signs a certificate that lives about 12 hours, so the expiry check
          # honestly says WARN here; what matters is that HTTPS answers (a FAIL row would exit 1 above).
          grep -E '^\| HTTPS \(localhost\) \| (PASS|WARN) \|' acceptance.md
          grep -F '| Administrator | PASS |' acceptance.md
          grep -F '| Backups | PASS |' acceptance.md
          grep -F '| Nightly update | PASS |' acceptance.md
          grep -F '| AI connection | ACTION |' acceptance.md
      - name: Logs on failure
        if: failure()
        run: sudo docker compose --project-directory deploy -f deploy/compose.production.yaml logs --tail 80
