name: Provider acceptance

# Real AI provider and speech-to-text acceptance (AI-002..004, ING-005). Each check runs only
# when its repository secret exists (Settings → Secrets and variables → Actions); without
# secrets the tests are skipped and the summary says what is missing.
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'
  push:
    branches: [main]
    paths:
      - 'packages/providers/**'
      - 'packages/ingestion/src/transcription.ts'
      - '.github/workflows/provider-acceptance.yml'

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
      TRANSCRIPTION_API_KEY: ${{ secrets.TRANSCRIPTION_API_KEY }}
      TRANSCRIPTION_BASE_URL: ${{ vars.TRANSCRIPTION_BASE_URL || 'https://api.openai.com/v1' }}
      TRANSCRIPTION_MODEL: ${{ vars.TRANSCRIPTION_MODEL || 'whisper-1' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.6.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@docoo/ingestion..." --filter "@docoo/providers..." build
      - name: Which secrets are configured
        run: |
          {
            echo '### Provider acceptance'
            for name in OPENAI_API_KEY GEMINI_API_KEY ANTHROPIC_API_KEY TRANSCRIPTION_API_KEY; do
              if [ -n "${!name}" ]; then echo "- $name: configured, tested"; else echo "- $name: missing, skipped"; fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: AI providers (AI-002..004)
        run: pnpm --filter @docoo/providers test:acceptance
      - name: Speech-to-text on the acceptance corpus (ING-005)
        run: pnpm --filter @docoo/ingestion test:acceptance
