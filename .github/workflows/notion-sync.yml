name: Notion documentation sync

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Rewrite every page even when its checksum is unchanged'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/notion/**'

permissions:
  contents: write

concurrency:
  group: notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:validate
      - run: pnpm docs:test
      - run: pnpm docs:sync:plan
      - name: Check connector configuration
        id: connector
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          if [ -n "$NOTION_TOKEN" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::warning title=Notion sync disabled::Add the NOTION_TOKEN repository secret (a Notion internal integration shared with the Docoo root page) to publish docs.'
          fi
      - name: Publish to Notion
        id: publish
        if: ${{ steps.connector.outputs.enabled == 'true' }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: node scripts/notion/sync.mjs ${{ inputs.force && '--force' || '' }}
      - name: Record sync state
        if: ${{ always() && steps.connector.outputs.enabled == 'true' && steps.publish.outcome != 'skipped' }}
        run: |
          if git diff --quiet -- docs/_meta/notion-state.json; then
            echo 'No state changes to record.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/_meta/notion-state.json
          git commit -m "docs: record Notion sync for ${GITHUB_SHA::7}"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 5))
          done
          exit 1
