name: Notion documentation sync

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Rewrite every page even when its checksum is unchanged'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/notion/**'

permissions:
  contents: write

concurrency:
  group: notion-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.6.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: pnpm
      - name: Restore durable sync state
        id: state
        run: |
          branch=codex/notion-sync-state
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" > /dev/null; then
            git fetch --no-tags origin "refs/heads/$branch"
            parent="$(git rev-parse FETCH_HEAD)"
            git show "$parent:docs/_meta/notion-state.json" > /tmp/docoo-notion-state.json
            node -e "JSON.parse(require('node:fs').readFileSync('/tmp/docoo-notion-state.json', 'utf8'))"
            cp /tmp/docoo-notion-state.json docs/_meta/notion-state.json
            echo "parent=$parent" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" != 2 ]; then exit "$status"; fi
            echo 'No dedicated state branch yet; using the reviewed repository state.'
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:validate
      - run: pnpm docs:test
      - run: pnpm docs:sync:plan
      - name: Check connector configuration
        id: connector
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          if [ -n "$NOTION_TOKEN" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::warning title=Notion sync disabled::Add the NOTION_TOKEN repository secret (a Notion internal integration shared with the Docoo root page) to publish docs.'
          fi
      - name: Publish to Notion
        id: publish
        if: ${{ steps.connector.outputs.enabled == 'true' }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: node scripts/notion/sync.mjs ${{ inputs.force && '--force' || '' }}
      - name: Record sync state
        if: ${{ always() && steps.connector.outputs.enabled == 'true' && steps.publish.outcome != 'skipped' }}
        env:
          STATE_PARENT: ${{ steps.state.outputs.parent }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          state_index="$(mktemp)"
          trap 'rm -f "$state_index"' EXIT
          export GIT_INDEX_FILE="$state_index"
          git read-tree --empty
          git add docs/_meta/notion-state.json
          tree="$(git write-tree)"
          if [ -n "$STATE_PARENT" ]; then
            if [ "$(git rev-parse "$STATE_PARENT^{tree}")" = "$tree" ]; then
              echo 'No state changes to record.'
              exit 0
            fi
            commit="$(git commit-tree "$tree" -p "$STATE_PARENT" -m "docs: record Notion sync for ${GITHUB_SHA::7}")"
          else
            commit="$(git commit-tree "$tree" -m "docs: record Notion sync for ${GITHUB_SHA::7}")"
          fi
          # This branch contains only sync metadata, never application code. A normal
          # fast-forward push also refuses concurrent changes; main remains protected.
          git push origin "$commit:refs/heads/codex/notion-sync-state"
