name: Security

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
  # Every pull request runs the gates so they can be required checks (SEC-001).
  pull_request:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.6.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high

  codeql:
    # Temporarily skip CodeQL on private repos without Code Security; the owner approved the exception.
    if: ${{ !github.event.repository.private || vars.CODEQL_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4

  filesystem-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  container-scan:
    # Builds each service image and fails on fixable HIGH/CRITICAL vulnerabilities (SEC-001).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: '@docoo/api'
            name: api
            start: '--import ./dist/instrumentation.js dist/main.js'
            system: ''
          - package: '@docoo/web'
            name: web
            start: 'node_modules/next/dist/bin/next start -p 3000'
            system: ''
          - package: '@docoo/worker-agent'
            name: worker-agent
            start: 'dist/main.js'
            system: ''
          - package: '@docoo/worker-ingestion'
            name: worker-ingestion
            start: 'dist/main.js'
            system: 'tesseract-ocr tesseract-ocr-eng tesseract-ocr-fas poppler-utils'
    steps:
      - uses: actions/checkout@v7
      - name: Build ${{ matrix.name }} image
        run: |
          docker build -f infra/docker/Dockerfile.node \
            --build-arg PACKAGE='${{ matrix.package }}' \
            --build-arg START='${{ matrix.start }}' \
            --build-arg SYSTEM_PACKAGES='${{ matrix.system }}' \
            -t docoo-${{ matrix.name }}:ci .
      - name: Smoke-test the image entrypoint
        run: docker run --rm --entrypoint node docoo-${{ matrix.name }}:ci -e "process.exit(0)"
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: docoo-${{ matrix.name }}:ci
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
