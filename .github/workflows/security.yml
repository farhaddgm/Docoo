name: Security

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
  # Every pull request runs the gates so they can be required checks (SEC-001).
  pull_request:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.6.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high

  codeql:
    # Temporarily skip CodeQL on private repos without Code Security; the owner approved the exception.
    if: ${{ !github.event.repository.private || vars.CODEQL_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4

  sast:
    # Free SAST that also works on private repositories without Code Security (SEC-001):
    # the open Semgrep JavaScript/TypeScript rules at a pinned commit; any ERROR finding fails.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Fetch the pinned Semgrep rules
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/semgrep/semgrep-rules.git "$RUNNER_TEMP/semgrep-rules"
          git -C "$RUNNER_TEMP/semgrep-rules" checkout --quiet a84ff9cc2453ca91d581380de4b8b3f272f6f4be -- javascript typescript
          mkdir -p "$RUNNER_TEMP/rules"
          cp -r "$RUNNER_TEMP/semgrep-rules/javascript" "$RUNNER_TEMP/semgrep-rules/typescript" "$RUNNER_TEMP/rules/"
          find "$RUNNER_TEMP/rules" -type f ! -name '*.yaml' ! -name '*.yml' -delete
          find "$RUNNER_TEMP/rules" -name '*.test.*' -delete
      - name: Semgrep
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -v "$RUNNER_TEMP/rules:/rules:ro" -w /src semgrep/semgrep:latest@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b \
            semgrep scan --config /rules --severity ERROR --metrics off --error \
              --exclude node_modules --exclude dist --exclude .next --exclude test-results \
              --exclude '*.test.ts' --exclude test

  filesystem-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  container-scan:
    name: container-scan (${{ matrix.name }})
    # Builds each service image and fails on fixable HIGH/CRITICAL vulnerabilities (SEC-001).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: '@docoo/api'
            name: api
            start: '--import ./dist/instrumentation.js dist/main.js'
            # PDF rendering runs in its own isolated image.
            system: ''
          - package: '@docoo/document-renderer'
            name: document-renderer
            start: 'dist/main.js'
            system: 'chromium fonts-noto-core'
          - package: '@docoo/web'
            name: web
            start: 'node_modules/next/dist/bin/next start -p 3000'
            system: ''
          - package: '@docoo/worker-agent'
            name: worker-agent
            start: 'dist/main.js'
            system: ''
          - package: '@docoo/worker-ingestion'
            name: worker-ingestion
            start: 'dist/main.js'
            system: 'tesseract-ocr tesseract-ocr-eng tesseract-ocr-fas poppler-utils'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build ${{ matrix.name }} image
        run: |
          docker build -f infra/docker/Dockerfile.node \
            --build-arg PACKAGE='${{ matrix.package }}' \
            --build-arg START='${{ matrix.start }}' \
            --build-arg SYSTEM_PACKAGES='${{ matrix.system }}' \
            -t docoo-${{ matrix.name }}:ci .
      - name: Smoke-test the image entrypoint
        run: docker run --rm --entrypoint node docoo-${{ matrix.name }}:ci -e "process.exit(0)"
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: image
          image-ref: docoo-${{ matrix.name }}:ci
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  infrastructure-scan:
    name: infrastructure-scan (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: postgres
            image: docoo-postgres:ci
          - name: caddy
            image: caddy:2@sha256:f2a1290d0463aad60660d4ec134943f183ee2a5f6c3eb7bf32dd984f2f020772
          - name: redis
            image: docoo-redis:ci
          - name: object-store
            image: chrislusf/seaweedfs:latest@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
          - name: clamav
            image: docoo-clamav:ci
          - name: temporal
            image: docoo-temporal:ci
          - name: object-backup
            image: docoo-object-backup:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build PostgreSQL runtime image
        if: matrix.name == 'postgres'
        run: docker build -t docoo-postgres:ci infra/postgres
      - name: Build patched redis runtime
        if: matrix.name == 'redis'
        run: docker build -f infra/docker/Dockerfile.patched --build-arg BASE_IMAGE=redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499 --build-arg RUNTIME_USER=redis -t docoo-redis:ci infra/docker
      - name: Build patched clamav runtime
        if: matrix.name == 'clamav'
        run: docker build -f infra/docker/Dockerfile.patched --build-arg BASE_IMAGE=clamav/clamav:1.4@sha256:57deb108fc4c72778aa83eafbca7bb7153e28c3f57c005afd38d31f16da86f23 --build-arg RUNTIME_USER=clamav -t docoo-clamav:ci infra/docker
      - name: Build patched temporal runtime
        if: matrix.name == 'temporal'
        run: docker build -f infra/docker/Dockerfile.patched --build-arg BASE_IMAGE=temporalio/temporal:latest@sha256:ad4c82c97bd12b417d1ea942610dbcd511afb250c4d5ed26c694009533df447e --build-arg RUNTIME_USER=temporal -t docoo-temporal:ci infra/docker
      - name: Build patched object backup runtime
        if: matrix.name == 'object-backup'
        run: docker build -f infra/docker/Dockerfile.rclone -t docoo-object-backup:ci infra/docker
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: image
          image-ref: ${{ matrix.image }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
