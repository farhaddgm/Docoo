name: Release

# Publishes a GitHub Release for vX.Y.Z from the matching CHANGELOG.md section.
# Either push the tag, or run this workflow manually on main: it then creates
# the tag from package.json's version on the current main commit.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve tag
        id: tag
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          if [ "${GITHUB_EVENT_NAME}" = 'workflow_dispatch' ]; then
            if [ "${GITHUB_REF}" != 'refs/heads/main' ]; then
              echo '::error::Manual releases run only on main.'
              exit 1
            fi
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "::error::Tag ${tag} already exists. Bump package.json before releasing."
              exit 1
            fi
          elif [ "${tag}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}."
            exit 1
          fi
          echo "name=${tag}" >> "$GITHUB_OUTPUT"
      - name: Extract release notes
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          awk -v v="${TAG#v}" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[0-9.]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${TAG}."
            exit 1
          fi
      - name: Create tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "${TAG}" -m "Docoo ${TAG}"
          git push origin "refs/tags/${TAG}"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: gh release create "${TAG}" --title "Docoo ${TAG}" --notes-file release-notes.md --verify-tag
