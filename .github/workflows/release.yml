name: Release

# Publishes a GitHub Release for vX.Y.Z from the matching CHANGELOG.md section.
# Raising "version" in package.json on main releases it automatically (the tag is
# created on that commit; nothing happens if the tag already exists). You can also
# push a tag yourself, or run this workflow manually on main.
# `install.sh update` installs the latest tag, so a change reaches servers only
# once its version is released.

on:
  push:
    branches: [main]
    paths: [package.json]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Resolve tag
        id: tag
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          echo "create=false" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_EVENT_NAME}" = 'push' ] && [ "${GITHUB_REF}" = 'refs/heads/main' ]; then
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "Tag ${tag} already exists; no release needed."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "create=true" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_EVENT_NAME}" = 'workflow_dispatch' ]; then
            if [ "${GITHUB_REF}" != 'refs/heads/main' ]; then
              echo '::error::Manual releases run only on main.'
              exit 1
            fi
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "::error::Tag ${tag} already exists. Bump package.json before releasing."
              exit 1
            fi
            echo "create=true" >> "$GITHUB_OUTPUT"
          elif [ "${tag}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}."
            exit 1
          fi
          echo "name=${tag}" >> "$GITHUB_OUTPUT"
      - name: Extract release notes
        if: ${{ steps.tag.outputs.skip != 'true' }}
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          awk -v v="${TAG#v}" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[0-9.]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${TAG}."
            exit 1
          fi
      - name: Require the exact main commit to pass every release gate
        if: ${{ steps.tag.outputs.skip != 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/release-gate.py
      - name: Sign release evidence using the GitHub workflow identity
        if: ${{ steps.tag.outputs.skip != 'true' }}
        run: |
          python3 - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location('release_verify', 'scripts/deploy/verify-release.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.cosign_binary()
          PY
          "$HOME/.cache/docoo-release-verifier/cosign-v3.1.3-amd64" sign-blob --yes --bundle security-gate.sigstore.json security-gate.json
          python3 - <<'PY'
          import importlib.util, json, os, pathlib
          spec = importlib.util.spec_from_file_location('release_verify', 'scripts/deploy/verify-release.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          body = pathlib.Path('security-gate.json').read_bytes()
          manifest = json.loads(body)
          module.verify_signature(body, pathlib.Path('security-gate.sigstore.json').read_bytes(), manifest['tag'], os.environ['GITHUB_SHA'])
          if module.source_digest('.', os.environ['GITHUB_SHA']) != manifest['sourceArchiveSha256']:
              raise SystemExit('Signed source digest mismatch')
          print('Release signature and source digest verified before publication.')
          PY
      - name: Create tag
        if: ${{ steps.tag.outputs.create == 'true' }}
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "${TAG}" -m "Docoo ${TAG}"
          git push origin "refs/tags/${TAG}"
      - name: Publish GitHub Release
        if: ${{ steps.tag.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: gh release create "${TAG}" security-gate.json security-gate.sigstore.json --title "Docoo ${TAG}" --notes-file release-notes.md --verify-tag
