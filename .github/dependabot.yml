version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Match pnpm's existing 10080-minute release-age policy for version updates.
    # Dependabot security updates do not use this cooldown.
    groups:
      react-runtime:
        applies-to: version-updates
        patterns: [react, react-dom]
      opentelemetry:
        applies-to: version-updates
        patterns: ['@opentelemetry/*']
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      codeql:
        patterns: [github/codeql-action/*]
  - package-ecosystem: docker
    directories:
      - /infra/docker
      - /infra/postgres
      - /deploy
      - /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
