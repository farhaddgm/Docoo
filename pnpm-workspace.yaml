packages:
  - apps/*
  - packages/*

minimumReleaseAge: 10080

allowBuilds:
  '@scarf/scarf': false
  argon2: true
  esbuild: true
  protobufjs: true
  sharp: true

overrides:
  # One Fastify copy for Nest's adapter and the plugins (patch release, see Dependabot #40/#45).
  fastify: 5.12.5
  '@grpc/grpc-js': '>=1.14.5 <2'
