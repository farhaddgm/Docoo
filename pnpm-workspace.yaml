packages:
  - apps/*
  - packages/*

minimumReleaseAge: 10080
# Reviewed security patch for CVE-2026-93749; retain the age gate for all other releases.
minimumReleaseAgeExclude:
  - source-map-js@1.2.2
  # Reviewed URI parser security fixes (GHSA-w74x-v6f9-j3xg and related advisories).
  - fast-uri@3.1.9
  - fast-uri@4.2.3
  # Reviewed: 1.25.0 moves core-bridge to zip 9.0.5, fixing CVE-2026-115905/115907/115908/115909
  # (Trivy fails the worker images on 1.24.0). Remove once the release is past the age gate.
  - '@temporalio/activity@1.25.0'
  - '@temporalio/client@1.25.0'
  - '@temporalio/common@1.25.0'
  - '@temporalio/core-bridge@1.25.0'
  - '@temporalio/nexus@1.25.0'
  - '@temporalio/proto@1.25.0'
  - '@temporalio/worker@1.25.0'
  - '@temporalio/workflow@1.25.0'

allowBuilds:
  '@scarf/scarf': false
  # Optional binary check only; the platform binary ships as an optional dependency.
  '@swc/core': false
  argon2: true
  esbuild: true
  protobufjs: true
  sharp: true

overrides:
  # One Fastify copy for Nest's adapter and the plugins (patch release, see Dependabot #40/#45).
  fastify: 5.12.7
  # Keep each URI parser on its existing major while applying the advisory fixes.
  'fast-uri@^3': 3.1.9
  'fast-uri@^4': 4.2.3
  ip-address: 10.7.4
  # Drizzle's legacy loader uses transform APIs; no development server is exposed.
  '@esbuild-kit/core-utils>esbuild': 0.28.2
  '@grpc/grpc-js': '>=1.14.5 <2'
  # Security patch releases required by the dependency/image release gates.
  source-map-js: 1.2.2
  sharp: 0.35.5
  # GHSA-587h-7wmj-h5pm: launch-editor bypass in vite 8.3.0-8.3.2 (pulled in by vitest).
  vite: '>=8.3.3'
  # GHSA-3f7j-7jwc-fxfj: Windows command injection in systeminformation < 5.33.16 (pulled in by the
  # OpenTelemetry host-metrics instrumentation). 5.33.16 is past the release-age gate; 5.33.17 is not yet.
  systeminformation: 5.33.16
