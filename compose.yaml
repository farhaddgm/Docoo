name: docoo-dev

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg18@sha256:508c5290cda481d4f5f846446a26e9c1b804766828a394a5861de1b348a18b4c
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docoo}
      POSTGRES_USER: ${POSTGRES_USER:-docoo_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docoo-local-change-me}
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:-docoo_runtime}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:-docoo-runtime-local-change-me}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data-pg18:/var/lib/postgresql
      - ./infra/postgres/001-create-runtime-role.sh:/docker-entrypoint-initdb.d/001-create-runtime-role.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  object-store:
    image: chrislusf/seaweedfs:latest@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: ['mini', '-dir=/data']
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-docoo-local}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-docoo-local-change-me}
      S3_BUCKET: ${S3_BUCKET:-docoo-local}
    ports:
      - '127.0.0.1:${S3_API_PORT:-8333}:8333'
      - '127.0.0.1:${S3_CONSOLE_PORT:-8888}:8888'
    volumes:
      - object-store-data:/data
    healthcheck:
      test: ['CMD', 'nc', '-z', 'localhost', '8333']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  malware-scanner:
    image: clamav/clamav:1.4@sha256:57deb108fc4c72778aa83eafbca7bb7153e28c3f57c005afd38d31f16da86f23
    # Downloads the official signatures on first start; uploads stay quarantined until ready.
    ports:
      - '127.0.0.1:${CLAMD_PORT:-3310}:3310'
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ['CMD-SHELL', "printf 'zPING\\0' | nc -w 2 localhost 3310 | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  mail:
    # Local inbox for password-reset mail: SMTP on 1025, web UI on http://localhost:8025.
    image: axllent/mailpit:latest@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    ports:
      - '127.0.0.1:${MAIL_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAIL_UI_PORT:-8025}:8025'

  temporal:
    image: temporalio/temporal:latest@sha256:ad4c82c97bd12b417d1ea942610dbcd511afb250c4d5ed26c694009533df447e
    command:
      ['server', 'start-dev', '--ip', '0.0.0.0', '--db-filename', '/home/temporal/temporal.db']
    ports:
      - '127.0.0.1:${TEMPORAL_PORT:-7233}:7233'
    volumes:
      - temporal-data:/home/temporal
    healthcheck:
      test: ['CMD', 'nc', '-z', 'localhost', '7233']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  temporal-ui:
    image: temporalio/ui:latest@sha256:3899d5cf749b5555c9f798d46f2423b1d6190ea391ca713db5d1bba961759e58
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: ${WEB_ORIGIN:-http://localhost:3000}
    ports:
      - '127.0.0.1:${TEMPORAL_UI_PORT:-8080}:8080'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:8080/']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest@sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6
    profiles: [observability]
    command: ['--config=/etc/otelcol-contrib/config.yaml']
    volumes:
      - ./infra/otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - '127.0.0.1:${OTEL_GRPC_PORT:-4317}:4317'
      - '127.0.0.1:${OTEL_HTTP_PORT:-4318}:4318'
      - '127.0.0.1:${OTEL_PROMETHEUS_PORT:-9464}:9464'
    depends_on:
      - tempo

  prometheus:
    image: prom/prometheus:latest@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    profiles: [observability]
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.path=/prometheus']
    ports:
      - '127.0.0.1:${PROMETHEUS_PORT:-9090}:9090'
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      - otel-collector

  tempo:
    image: grafana/tempo:latest@sha256:1ce31d6d7ffab62189685e8c47881d4a561c5d38bd0dbd66e40ca83cef07923d
    profiles: [observability]
    command: ['-config.file=/etc/tempo/config.yaml']
    ports:
      - '127.0.0.1:${TEMPO_HTTP_PORT:-3200}:3200'
    volumes:
      - ./infra/tempo/tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo

  loki:
    image: grafana/loki:latest@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    profiles: [observability]
    command: ['-config.file=/etc/loki/config.yaml']
    ports:
      - '127.0.0.1:${LOKI_PORT:-3100}:3100'
    volumes:
      - ./infra/loki/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki

  grafana:
    image: grafana/grafana:latest@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-docoo-local-change-me}
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-3001}:3000'
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
      - loki

volumes:
  postgres-data-pg18:
  redis-data:
  object-store-data:
  temporal-data:
  clamav-data:
  prometheus-data:
  tempo-data:
  loki-data:
  grafana-data:
